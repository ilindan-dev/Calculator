name: Build & Test (GCC/MinGW)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: ${{ matrix.os }} - GCC
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]

    steps:
      - uses: actions/checkout@v4

      # ---------------- LINUX SETUP ----------------
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # ---------------- WINDOWS SETUP ----------------
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          version: 12.2.0

      # ---------------- CONFIGURE ----------------
      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      # ---------------- BUILD ----------------
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      # ---------------- TEST ----------------
      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure --verbose